[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-assistant"
version = "0.1.0"
description = "Local speech-to-speech desktop assistant powered by LFM3-Omni-2B via llama.cpp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Buddy Contributors" }]
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "pysilero-vad>=1.0",
    "vosk>=0.3.45",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "PyGObject>=3.48",
]

[project.optional-dependencies]
google = [
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[project.scripts]
buddy = "buddy.cli:main"

[tool.setuptools.packages.find]
include = ["buddy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
filterwarnings = ["ignore::DeprecationWarning"]
