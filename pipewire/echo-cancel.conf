# PipeWire WebRTC acoustic echo cancellation filter for Buddy
# Place in ~/.config/pipewire/pipewire.conf.d/echo-cancel.conf

context.modules = [
    {
        name = libpipewire-module-echo-cancel
        args = {
            capture.props = {
                node.name = "buddy-echo-cancel-capture"
                node.description = "Buddy Echo-Cancel Capture"
            }
            playback.props = {
                node.name = "buddy-echo-cancel-playback"
                node.description = "Buddy Echo-Cancel Playback"
            }
            source.props = {
                node.name = "buddy-echo-cancel-source"
                node.description = "Buddy Echo-Cancelled Microphone"
            }
            sink.props = {
                node.name = "buddy-echo-cancel-sink"
                node.description = "Buddy Echo-Cancelled Output"
            }
            library.name = aec/libspa-aec-webrtc
            aec.args = {
                webrtc.gain_control = true
                webrtc.extended_filter = true
                webrtc.noise_suppression = true
            }
        }
    }
]
